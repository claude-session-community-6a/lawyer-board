name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  
jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `astro check` cannot run under TypeScript 7 yet, so tsc is the typecheck.
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build
        run: pnpm build

  docker:
    name: Build image
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # Build only — publishing happens in the Deploy workflow.
      - name: Build image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: false
          load: true
          tags: lawyer-board:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name lawyer-board -p 4321:4321 lawyer-board:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4321/expedientes > /dev/null; then
              echo "Server responded on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "Server never became healthy; container logs:"
          docker logs lawyer-board
          exit 1
