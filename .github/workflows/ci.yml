name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # One pipeline: the app is typechecked, built and packaged in the same
  # workspace, so the image contains exactly the artifacts that were verified.
  build:
    name: Build and package
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      PUBLIC_CONVEX_URL: ${{ vars.PUBLIC_CONVEX_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # convex/_generated/ is gitignored, so it is absent from a fresh checkout
      # and has to be produced here — the typecheck and build read its types.
      # codegen talks to the deployment named by the key, so this needs
      # CONVEX_DEPLOY_KEY as a repository secret; there is no offline mode.
      # - name: Generate Convex bindings
      #   run: pnpm exec convex codegen --typecheck disable
      #   env:
      #     CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # `astro check` cannot run under TypeScript 7, so the script is
      # `astro sync && tsc --noEmit`; the sync generates the astro:env types.
      # - name: Typecheck
      #   run: pnpm typecheck

      - name: Build
        run: |
          pnpm convex deploy --yes
          pnpm build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Replaces the dev tree in place with a production-only, hoisted one.
      # `hoisted` writes a plain node_modules directory instead of pnpm's
      # symlinked store layout, which is what makes it copyable into an image.
      # Runs after the build, which needs devDependencies.
      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --config.node-linker=hoisted

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # Packaging only — publishing happens in the Deploy workflow. The
      # Dockerfile just copies dist/ and node_modules from the context.
      - name: Build image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: false
          tags: lawyer-board:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
