name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never cancel an apply in flight: a half-applied change with an abandoned lock
# is far worse than waiting for the previous run to finish.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

defaults:
  run:
    working-directory: terraform

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    # Required for the OIDC subject to match the deploy role's trust policy,
    # which is scoped to environment:production on refs/heads/main.
    environment:
      name: production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: terraform init -no-color

      - name: Apply
        id: apply
        # Applies its own fresh plan rather than a plan file carried over from
        # the PR. The PR plan can be hours stale and would apply against state
        # that has since moved.
        #
        # -lock-timeout gives a concurrent drift run time to finish instead of
        # failing immediately on a held lock.
        run: terraform apply -auto-approve -no-color -lock-timeout=10m

      - name: Summarise outputs
        if: success()
        run: |
          {
            echo "## Terraform applied"
            echo
            echo '| Output | Value |'
            echo '| --- | --- |'
            terraform output -json \
              | jq -r 'to_entries[] | select(.value.sensitive | not) | "| \(.key) | `\(.value.value)` |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain a failed apply
        if: failure() && steps.apply.outcome == 'failure'
        run: |
          {
            echo "## Apply failed"
            echo
            echo "State may be partially applied. Before re-running, check:"
            echo
            echo "- \`terraform plan\` locally to see what is left outstanding."
            echo "- Whether the run died holding the S3 lock. If so, the error"
            echo "  message names the lock ID; clear it with"
            echo "  \`terraform force-unlock <id>\` only after confirming no"
            echo "  other apply is running."
          } >> "$GITHUB_STEP_SUMMARY"
