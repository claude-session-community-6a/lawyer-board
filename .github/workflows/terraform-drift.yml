name: Terraform Drift

on:
  schedule:
    # 13:17 UTC daily. Deliberately off the hour: scheduled runs bunch up and
    # get delayed at :00.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

# If an apply is running, the drift check would either block on the lock or
# report the apply's own in-flight changes as drift.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  DRIFT_ISSUE_TITLE: "Terraform drift detected (production)"

defaults:
  run:
    working-directory: terraform

jobs:
  detect:
    name: Detect drift
    runs-on: ubuntu-latest

    # No `environment:` here. A scheduled run has the OIDC subject
    # repo:OWNER/REPO:ref:refs/heads/main, which needs its own statement in the
    # role's trust policy. Adding the environment instead would work, but would
    # file a deployment record against production every single day.

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: terraform init -no-color

      - name: Plan
        id: plan
        # -detailed-exitcode is what makes this a drift check rather than a
        # plan: 0 means state matches reality, 2 means it does not, 1 is a
        # genuine error. Without it every run exits 0 and detects nothing.
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -lock=false > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail on a broken plan
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "::error::terraform plan failed, so drift is unknown. This is not a clean run."
          exit 1

      - name: Sync the drift tracking issue
        # Opening and closing share the same issue lookup, so they are one step.
        # Not run when the exit code is 1: the step above already failed the job
        # and drift status is unknown, which is not the same as "no drift".
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # github-script runs from the workspace root, not terraform/.
          PLAN_FILE: terraform/plan.txt
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');

            const TITLE = process.env.DRIFT_ISSUE_TITLE;
            const LABEL = 'terraform-drift';
            const MAX_OUTPUT = 55000;

            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // listForRepo returns pull requests alongside issues; the only thing
            // telling them apart is the presence of a `pull_request` key.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === TITLE);

            if (process.env.PLAN_EXIT === '0') {
              if (!existing) {
                core.info('No drift, and no open issue to close.');
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Drift cleared: state now matches the configuration. [run log](${runUrl})`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed issue #${existing.number}`);
              return;
            }

            const raw = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const truncated = raw.length > MAX_OUTPUT;
            const output = truncated ? raw.slice(0, MAX_OUTPUT) : raw;

            const body = [
              'Real infrastructure has diverged from what is committed in `terraform/`.',
              '',
              'Either someone changed something by hand, or an apply did not finish.',
              'Reconcile by reverting the console change, or by codifying it in',
              '`terraform/` and letting the apply workflow adopt it.',
              '',
              `Last checked: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC · [run log](${runUrl})`,
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```terraform',
              output,
              ...(truncated ? ['', '... truncated, see the run log for the rest ...'] : []),
              '```',
              '',
              '</details>',
            ].join('\n');

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: LABEL,
                color: 'B60205',
                description: 'Infrastructure has diverged from the Terraform config',
              });
            } catch (error) {
              // 422 is "already exists", which is every run after the first.
              if (error.status !== 422) throw error;
            }

            if (existing) {
              // Overwrite the body rather than appending a comment, so the issue
              // always shows current drift instead of a pile of daily history.
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create({
                owner,
                repo,
                title: TITLE,
                body,
                labels: [LABEL],
              });
              core.info(`Opened issue #${data.number}`);
            }

            core.warning('Drift detected. See the tracking issue.');

      - name: Summary
        if: always()
        run: |
          case "${{ steps.plan.outputs.exitcode }}" in
            0) echo "No drift: state matches the configuration." >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "Drift detected. A tracking issue has been opened or updated." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "Plan failed; drift status unknown." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
