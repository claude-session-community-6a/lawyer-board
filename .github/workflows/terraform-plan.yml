name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

# One plan per PR. Superseding an in-flight plan is safe because plans never
# mutate anything.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    # A pull_request from a fork gets a read-only token and no OIDC identity, so
    # role assumption cannot succeed. Skip rather than fail red on every one.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          # The wrapper exists to expose stdout as a step output; this workflow
          # captures output to a file instead, and the wrapper mangles exit
          # codes we care about.
          terraform_wrapper: false

      - name: Check formatting
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: terraform init -no-color

      - name: Validate
        id: validate
        run: terraform validate -no-color
        continue-on-error: true

      - name: Plan
        id: plan
        # -lock=false because a plan has no business holding the state lock: a
        # long-running PR check should never block an apply. No -out file, so
        # nothing containing resource values is written where it could be
        # picked up as an artifact.
        run: |
          set +e
          terraform plan -no-color -lock=false > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post plan to the pull request
        if: always() && steps.plan.conclusion != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # github-script runs from the workspace root: `defaults.run` only
          # applies to `run:` steps, so this path needs the terraform/ prefix.
          PLAN_FILE: terraform/plan.txt
          FMT: ${{ steps.fmt.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');

            const MARKER = '<!-- terraform-plan -->';
            // GitHub rejects comment bodies over 65536 characters; leave room
            // for the surrounding markdown.
            const MAX_OUTPUT = 55000;

            const raw = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const truncated = raw.length > MAX_OUTPUT;
            const output = truncated ? raw.slice(0, MAX_OUTPUT) : raw;

            const status = (outcome) => (outcome === 'success' ? 'passed' : '**failed**');

            const body = [
              MARKER,
              '## Terraform plan',
              '',
              `Format: ${status(process.env.FMT)} · Validate: ${status(process.env.VALIDATE)}`,
              '',
              process.env.PLAN_EXIT === '0'
                ? 'Plan succeeded.'
                : '**Plan failed.** See the job log for the full trace.',
              '',
              '<details><summary>Output</summary>',
              '',
              '```terraform',
              output,
              ...(truncated ? ['', '... truncated, see the job log for the rest ...'] : []),
              '```',
              '',
              '</details>',
              '',
              '_This plan is advisory. The apply on `main` re-plans against current',
              'state, so what lands may differ from what you see here._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Paginated: on a long-running PR our comment can fall well past
            // the first page, and missing it would post a duplicate.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            // Last match wins, so a stray earlier duplicate stops being updated
            // rather than fighting with the newest one.
            const existing = comments.reverse().find((c) => c.body?.startsWith(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated plan comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created a new plan comment');
            }

      # Deferred to the end so the comment is posted even when something above
      # went wrong — a red check with no explanation is the annoying case.
      - name: Report failures
        if: always()
        run: |
          failed=0
          [ "${{ steps.fmt.outcome }}" = "success" ] || { echo "::error::terraform fmt -check failed. Run 'terraform fmt -recursive'."; failed=1; }
          [ "${{ steps.validate.outcome }}" = "success" ] || { echo "::error::terraform validate failed."; failed=1; }
          [ "${{ steps.plan.outputs.exitcode }}" = "0" ] || { echo "::error::terraform plan failed."; failed=1; }
          exit $failed
